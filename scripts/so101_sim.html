<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO-101 SIM</title>
<style>
/* tokens: copied from scripts/ui.html :root (.agent/rules/design.md) */
:root{
  --bg:#1e1e1e; --surface:#252526; --surface-2:#2d2d30; --surface-3:#333334;
  --border:#3c3c3c; --border-strong:#525257; --divider:#2b2b2c;
  --text:#d4d4d4; --text-muted:#9d9d9d; --text-faint:#6e6e72; --text-inv:#ffffff;
  --accent:#4ec9ff; --accent-bg:#0e639c; --accent-bg-hover:#1177bb;
  --accent-soft:rgba(78,201,255,.13); --accent-line:rgba(78,201,255,.30);
  --ok:#388a5a; --ok-text:#4ec99a;
  --warn:#9a7d12; --warn-text:#dcdcaa;
  --danger:#a1260d; --danger-hover:#c5341a; --danger-text:#f14c4c; --danger-soft:rgba(161,38,13,.16);
  --data-num:#9cdcfe; --data-tgt:#ce9178; --data-ok:#6a9955;
  --font-ui:system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:15px;
  --fw-reg:400; --fw-med:600; --fw-bold:700;
  --radius:4px; --radius-sm:3px; --bw:1px;
  --pad:11px; --gap:8px;
  --t-fast:.1s; --t-std:.16s; --ease:ease-out;
  /* one meaning, one colour - the same in the dials, the trace and the 3D view:
     goal = the orange ghost arm, actual = the bone-coloured solid arm,
     selection = accent, effort ramps grey -> amber -> red as it nears a trip */
  --c-goal:var(--data-tgt); --c-act:#d6d0c2; --c-sp:var(--text-faint); --c-cur:var(--data-num);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:var(--fw-reg) var(--fs-base)/1.4 var(--font-ui);user-select:none}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* columns follow the signal: command -> servo -> arm (the chevrons sit on the seams) */
#app{height:100%;display:grid;grid-template-columns:232px 436px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 190px;
  grid-template-areas:"top top top" "cmd servo arm" "cmd servo trace"}
header{grid-area:top;display:flex;align-items:center;gap:18px;padding:0 var(--pad);background:var(--surface);border-bottom:var(--bw) solid var(--border)}
#cmd{grid-area:cmd;overflow:auto;background:var(--surface);border-right:var(--bw) solid var(--border)}
#servo{grid-area:servo;overflow:auto;border-right:var(--bw) solid var(--border)}
#arm{grid-area:arm;position:relative;min-width:0;min-height:0}
#trace{grid-area:trace;border-top:var(--bw) solid var(--border);position:relative;min-width:0}
.chev{align-self:center;justify-self:start;margin-left:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:var(--bw) solid var(--border-strong);
  display:grid;place-items:center;color:var(--text-muted);z-index:5;pointer-events:none}
.chev svg{width:10px;height:10px}

/* ---------- header ---------- */
.brand{display:flex;align-items:center;gap:8px;font-weight:var(--fw-bold);font-size:var(--fs-md)}
.chip{font-size:var(--fs-2xs);font-weight:var(--fw-med);letter-spacing:.08em;color:var(--c-goal);border:var(--bw) solid currentColor;border-radius:var(--radius-sm);padding:0 5px}
.hstat{display:flex;gap:16px}
.hstat span{display:flex;align-items:center;gap:5px;color:var(--text-faint)}
.hstat b{font-weight:var(--fw-reg);color:var(--text)}
.hsp{flex:1}
.seg{display:inline-flex;border:var(--bw) solid var(--border);border-radius:var(--radius);overflow:hidden}
.seg button{background:var(--surface-3);border:0;border-right:var(--bw) solid var(--border);padding:4px 9px;cursor:pointer;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-sm)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.ib{display:inline-grid;place-items:center;width:30px;height:28px;background:var(--surface-3);border:var(--bw) solid var(--border);border-radius:var(--radius);cursor:pointer;color:var(--text-muted);transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
#torqueBtn{width:auto;padding:0 10px;display:inline-flex;gap:6px;align-items:center}
#torqueBtn.live{color:var(--ok-text);border-color:var(--ok)}
#torqueBtn.limp{color:var(--warn-text);border-color:var(--warn);background:rgba(154,125,18,.12)}
#torqueBtn .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- command column ---------- */
.grp{padding:12px var(--pad);border-bottom:var(--bw) solid var(--divider)}
.ghead{display:flex;align-items:center;gap:6px;color:var(--text-faint);margin-bottom:9px}
.ghead .ib{margin-left:auto;width:24px;height:22px}
.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pose{aspect-ratio:1/1;padding:0;background:var(--bg);border:var(--bw) solid var(--border);border-radius:var(--radius);cursor:pointer;overflow:hidden;display:grid;place-items:center;color:var(--text-muted)}
.pose:hover{border-color:var(--c-goal)}
.pose img{width:100%;height:100%;object-fit:contain;display:block}
.pose svg.i{width:26px;height:26px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.steps button{background:var(--surface-3);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:5px 0;cursor:pointer;color:var(--text-muted);font-family:var(--font-mono);font-size:var(--fs-sm)}
.steps button:hover{border-color:var(--c-goal);color:var(--c-goal)}
#prof{width:100%;height:58px;display:block;background:var(--bg);border:var(--bw) solid var(--border);border-radius:var(--radius);margin-bottom:8px}
.sl{display:grid;grid-template-columns:18px 1fr 64px;align-items:center;gap:6px;margin-bottom:4px;color:var(--text-faint)}
.sl output{text-align:right;font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--text-muted)}
/* sliders stay quiet: accent is reserved for the selected joint */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;margin:0;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--border-strong);border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4.5px;border-radius:50%;background:var(--c-act);border:2px solid var(--surface)}
input[type=range]:hover::-webkit-slider-thumb{background:var(--text-inv)}
input[type=range]::-moz-range-track{height:2px;background:var(--border-strong)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:var(--c-act);border:2px solid var(--surface)}

/* ---------- servo channels ---------- */
.ch{display:grid;grid-template-columns:62px 78px 64px 1fr;align-items:center;gap:10px;padding:8px var(--pad) 8px 8px;border-bottom:var(--bw) solid var(--divider);border-left:3px solid transparent;cursor:pointer}
.ch:hover{background:var(--surface)}
.ch.sel{background:var(--accent-soft)}
.ch.near{border-left-color:var(--warn-text)}
.ch.fault{border-left-color:var(--danger-text);background:var(--danger-soft)}
.who{position:relative;width:62px;height:62px;border-radius:var(--radius);background:var(--bg);border:var(--bw) solid var(--divider);overflow:hidden}
.ch.sel .who{border-color:var(--accent-line)}
.who img{width:100%;height:100%;display:block}
.who .n{position:absolute;left:4px;top:1px;font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-faint)}
.dial{width:78px;height:78px;touch-action:none;cursor:grab;overflow:visible}
.dial:active{cursor:grabbing}
.vals{display:flex;flex-direction:column;gap:1px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.vals .g{color:var(--c-goal);font-size:var(--fs-xs)}
.vals .a{color:var(--c-act);font-size:var(--fs-md)}
.vals .f{font-family:var(--font-ui);font-size:var(--fs-2xs);color:var(--danger-text);white-space:nowrap}
.meters{display:flex;flex-direction:column;gap:7px}
.mt{display:grid;grid-template-columns:14px 1fr 44px;align-items:center;gap:6px;color:var(--text-faint)}
.mt svg.i{width:13px;height:13px}
.mt output{text-align:right;font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted)}
.bar{position:relative;height:5px;background:var(--surface-3);border-radius:1px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--text-muted)}
.bar .trip{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--danger-text);opacity:.8}
.bar .timer{position:absolute;left:0;bottom:-4px;height:2px;background:var(--warn-text)}

/* ---------- arm view ---------- */
#arm canvas{display:block;width:100%;height:100%}
.tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.state{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:center;gap:7px;padding:4px 11px;border-radius:var(--radius);font-size:var(--fs-sm)}
.state.warn{display:flex;border:var(--bw) solid var(--warn);background:rgba(154,125,18,.15);color:var(--warn-text)}
.state.err{display:flex;border:var(--bw) solid var(--danger);background:var(--danger-soft);color:var(--danger-text)}
#selLabel{position:absolute;pointer-events:none;font:var(--fs-xs) var(--font-mono);color:var(--accent);transform:translate(12px,-50%)}

/* ---------- trace ---------- */
#traceCv{position:absolute;left:0;top:0;width:100%;height:100%}
#traceWho{position:absolute;left:8px;top:8px;width:40px;height:40px;border-radius:var(--radius);border:var(--bw) solid var(--accent-line);background:var(--bg);overflow:hidden}
#traceWho img{width:100%;height:100%}

@media (max-width:1180px){
  #app{grid-template-columns:232px minmax(0,1fr);grid-template-rows:44px 50vh auto 190px;
    grid-template-areas:"top top" "arm arm" "cmd servo" "trace trace";height:auto}
  #cmd,#servo{overflow:visible}
  .chev,.hstat{display:none}
}
</style>

<svg width="0" height="0" style="position:absolute">

<div id="app">
  <header>
    <div class="brand">SO-101 <span class="chip" title="仮想の腕。実機には繋がっていません">SIM</span></div>
    <div class="hstat mono">
      <span title="シミュレーション時刻"><svg class="i"><use href="#i-clock"/></svg><b id="hT">0.0</b>s</span>
      <span title="電源電圧（12 V / 5 A 電源、電流で下がる）"><svg class="i"><use href="#i-volt"/></svg><b id="hV">12.2</b>V</span>
      <span title="6 個のサーボの電流の合計"><svg class="i"><use href="#i-bolt"/></svg><b id="hA">0.00</b>A</span>
      <span title="床が腕を押し返す力"><svg class="i"><use href="#i-floor"/></svg><b id="hF">0.0</b>N</span>
    </div>
    <div class="hsp"></div>
    <div class="seg" id="rtfSeg" title="再生速度">
      <button data-rtf="1" class="on">1×</button><button data-rtf="0.5">½×</button><button data-rtf="0.25">¼×</button><button data-rtf="0.1">⅒×</button>
    </div>
    <button class="ib" id="pauseBtn" title="一時停止 / 再開（Space）"><svg class="i"><use href="#i-pause"/></svg></button>
    <button class="ib" id="torqueBtn" title="サーボの力を入れる / 抜く（Esc で脱力）"><span class="dot"></span><svg class="i"><use href="#i-power"/></svg></button>
  </header>

  <section id="cmd">
    <div class="grp">
      <div class="poses" id="poses"></div>
    </div>
    <div class="grp">
      <div class="ghead" title="選んだ関節の目標を一度に変える"><svg class="i"><use href="#i-step"/></svg></div>
      <div class="steps">
        <button data-step="-20">−20°</button><button data-step="-5">−5°</button><button data-step="5">+5°</button><button data-step="20">+20°</button>
      </div>
    </div>
    <div class="grp" id="regs">
      <div class="ghead"><svg class="i"><use href="#i-torque"/></svg><button class="ib" id="regsReset" title="サーボの設定を初期値に戻す"><svg class="i"><use href="#i-reset"/></svg></button></div>
      <canvas id="prof" title="90° 動かすときの速さの変化（最高速度と加速度で決まる）"></canvas>
      <div class="sl" title="最高速度 Goal_Velocity（右端は制限なし）"><svg class="i"><use href="#i-vmax"/></svg><input type="range" data-reg="Goal_Velocity" min="20" max="3400" step="20"><output></output></div>
      <div class="sl" title="加速度 Acceleration（右端は制限なし）"><svg class="i"><use href="#i-acc"/></svg><input type="range" data-reg="Acceleration" min="1" max="254"><output></output></div>
      <div class="sl" title="P ゲイン：ずれに対する硬さ"><svg class="i"><use href="#i-spring"/></svg><input type="range" data-reg="P_Coefficient" min="1" max="64"><output></output></div>
      <div class="sl" title="D ゲイン：揺れを抑える"><svg class="i"><use href="#i-damper"/></svg><input type="range" data-reg="D_Coefficient" min="0" max="128"><output></output></div>
      <div class="sl" title="トルク上限 Torque_Limit"><svg class="i"><use href="#i-limit"/></svg><input type="range" data-reg="Torque_Limit" min="0" max="1000" step="10"><output></output></div>
    </div>
    <div class="grp">
      <div class="ghead"><button class="ib on" id="floorBtn" title="床に当たる / すり抜ける" style="margin-left:0"><svg class="i"><use href="#i-floor"/></svg></button>
        <button class="ib" id="resetBtn" title="最初の状態に戻す（温度・保護も）"><svg class="i"><use href="#i-reset"/></svg></button></div>
      <div class="sl" title="先端に吊るす荷物"><svg class="i"><use href="#i-weight"/></svg><input type="range" id="payload" min="0" max="500" step="10" value="0"><output id="payloadV">0 g</output></div>
    </div>
  </section>
  <div class="chev" style="grid-area:servo"><svg><use href="#i-chev"/></svg></div>

  <section id="servo"><div id="channels"></div></section>
  <div class="chev" style="grid-area:arm"><svg><use href="#i-chev"/></svg></div>

  <section id="arm">
    <div class="state" id="armState"></div>
    <div class="tools">
      <button class="ib on" id="ghostBtn" title="指令した姿を重ねる"><svg class="i"><use href="#i-ghost"/></svg></button>
      <button class="ib" id="viewBtn" title="視点を戻す"><svg class="i"><use href="#i-view"/></svg></button>
    </div>
    <div id="selLabel"></div>
  </section>

  <section id="trace">
    <canvas id="traceCv"></canvas>
    <div id="traceWho"></div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from '/static/vendor/three/examples/jsm/controls/OrbitControls.js';

const JA = { shoulder_pan: '肩の旋回', shoulder_lift: '肩の上下', elbow_flex: '肘', wrist_flex: '手首の曲げ', wrist_roll: '手首の回転', gripper: 'グリッパ' };
const POSE_JA = { HOME: 'まっすぐ', READY: '構え', UP: '上を向く', FORWARD_LOW: '前の低い所', OBSERVE: '見下ろす' };
const FAULT_JA = { overload: '過負荷', overcurrent: '過電流', overheat: '過熱', voltage: '電圧', sensor: 'エンコーダ' };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
const icon = (id, cls = 'i') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const NS = 'http://www.w3.org/2000/svg';
const TICK_DEG = 360 / 4096;

let MODEL = null, S = null, seq = 0, sel = 2;
const hist = [];                       // rows: [t, (goal, sp, q, duty, cur) x 6]
const HIST_KEEP = 2400;
const THUMB = {};                      // joint index -> dataURL of the arm with that link lit

async function api(op, body = {}) {
  const r = await fetch('/api/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, ...body }) });
  return r.json();
}
const effortColor = f => f >= 1 ? css('--danger-text') : f >= 0.7 ? css('--warn-text') : css('--text-muted');

/* ============================== meshes + thumbnails ============================== */
async function loadMesh(id) {
  const buf = await (await fetch('/api/mesh/' + id)).arrayBuffer();
  const [vn, fn] = new Uint32Array(buf, 0, 2);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, 8, vn * 3), 3));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, 8 + vn * 12, fn * 3), 1));
  geo.computeVertexNormals();
  return geo;
}
const GEOS = {};
const setPose = (groups, poses) => groups.forEach((g, b) => { const p = poses[b]; g.position.set(p[0], p[1], p[2]); g.quaternion.set(p[4], p[5], p[6], p[3]); });

// a flat-lit arm in its own scene: pose silhouettes for the buttons, a lit link per channel
function makeThumbs() {
  const W = 160, H = 160;
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setSize(W, H); r.setClearColor(0x000000, 0);
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.6));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(0.4, 1, 0.8); sc.add(dl);
  const root = new THREE.Group(); root.rotation.x = -Math.PI / 2; sc.add(root);
  const dim = new THREE.MeshLambertMaterial({ color: css('--text-faint') });
  const pose = new THREE.MeshLambertMaterial({ color: css('--c-act') });
  const lit = new THREE.MeshLambertMaterial({ color: css('--accent') });
  const groups = MODEL.bodies.map(() => { const g = new THREE.Group(); root.add(g); return g; });
  const meshes = MODEL.geoms.map(g => {
    const m = new THREE.Mesh(GEOS[g.mesh], dim);
    m.position.fromArray(g.pos); m.quaternion.set(g.quat[1], g.quat[2], g.quat[3], g.quat[0]);
    m.userData.body = g.body; groups[g.body].add(m); return m;
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), new THREE.MeshBasicMaterial({ color: css('--surface-2') }));
  floor.position.z = MODEL.floor_z - 0.0005; root.add(floor);
  // one framing for all poses so they compare at the same scale
  const box = new THREE.Box3();
  for (const p of Object.values(MODEL.pose_bodies)) { setPose(groups, p); root.updateMatrixWorld(true); groups.forEach(g => box.expandByObject(g)); }
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(26, 1, 0.01, 10);
  const dist = Math.max(s.x, s.y) / (2 * Math.tan(13 * Math.PI / 180)) * 1.08;
  cam.position.set(c.x + dist * 0.25, c.y + dist * 0.18, c.z + dist); cam.lookAt(c);
  const snap = () => { r.render(sc, cam); return r.domElement.toDataURL(); };

  const poseImgs = {};
  for (const [k, p] of Object.entries(MODEL.pose_bodies)) {
    setPose(groups, p); meshes.forEach(m => m.material = pose); poseImgs[k] = snap();
  }
  // channel thumbnails: close-up framing on the reference pose, the joint's moving link lit
  setPose(groups, MODEL.ref_bodies); root.updateMatrixWorld(true);
  const b2 = new THREE.Box3(); groups.forEach(g => b2.expandByObject(g));
  const c2 = b2.getCenter(new THREE.Vector3()), s2 = b2.getSize(new THREE.Vector3());
  const d2 = Math.max(s2.x, s2.y) / (2 * Math.tan(13 * Math.PI / 180)) * 1.0;
  cam.position.set(c2.x + d2 * 0.3, c2.y + d2 * 0.2, c2.z + d2); cam.lookAt(c2);
  floor.visible = false;
  MODEL.joints.forEach((_, j) => {
    meshes.forEach(m => { const bj = MODEL.body_joint[m.userData.body]; m.material = bj === j ? lit : dim; });
    THUMB[j] = snap();
  });
  r.dispose();

}

const CH = [];
const R = 30, CX = 39, CY = 39;                           // dial geometry (SVG units)
const pt = (deg, r) => [CX + r * Math.sin(deg * Math.PI / 180), CY - r * Math.cos(deg * Math.PI / 180)];
function arc(a0, a1, r) {
  if (a1 < a0) [a0, a1] = [a1, a0];
  if (a1 - a0 < 0.05) a1 = a0 + 0.05;
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
}
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const setAttrs = (n, attrs) => { for (const k in attrs) n.setAttribute(k, attrs[k]); };

function buildChannels() {

        <div class="mt" title="モータ電流（赤線は過電流）">${icon('i-bolt')}<div class="bar"><div class="fill"></div><div class="trip"></div><div class="timer"></div></div><output>—</output></div>
        <div class="mt" title="温度（赤線で過熱停止）">${icon('i-thermo')}<div class="bar"><div class="fill"></div><div class="trip"></div></div><output>—</output></div>

      hub: el('circle', { cx: CX, cy: CY, r: 3.5, fill: css('--c-act') }),

    };
    Object.values(d).forEach(n => svg.appendChild(n));
    const c = { row, j, svg, d, g: row.querySelector('.g'), a: row.querySelector('.a'), f: row.querySelector('.f'), m: row.querySelectorAll('.mt'), rng: null, dragging: false };
    row.addEventListener('click', () => select(j));

function bindDial(c) {
  const toDeg = e => {
    const r = c.svg.getBoundingClientRect();
    let a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI;
    const [lo, hi] = c.rng;
    if (a < lo || a > hi) {                                      // outside the travel: snap to the nearer end
      const dist = x => Math.abs(((a - x + 540) % 360) - 180);
      a = dist(lo) < dist(hi) ? lo : hi;
    }
    return a;
  };
  c.svg.addEventListener('pointerdown', e => { if (!c.rng) return; c.dragging = true; c.svg.setPointerCapture(e.pointerId); select(c.j); sendGoal(c.j, toDeg(e)); });
  c.svg.addEventListener('pointermove', e => { if (c.dragging) sendGoal(c.j, toDeg(e)); });
  const end = () => { c.dragging = false; };
  c.svg.addEventListener('pointerup', end); c.svg.addEventListener('pointercancel', end);
}

const pendingGoal = {}; let goalTimer = null;
function sendGoal(j, deg) {
  pendingGoal[MODEL.joints[j]] = Math.round(deg * 10) / 10;
  drawGoal(CH[j], deg);
  if (!goalTimer) goalTimer = setTimeout(async () => {
    const goals = { ...pendingGoal }; for (const k in pendingGoal) delete pendingGoal[k]; goalTimer = null;
    await api('goal', { goals });
  }, 33);
}
function drawGoal(c, deg) {
  const [x, y] = pt(deg, R + 6), a = deg * Math.PI / 180;
  const ux = Math.sin(a), uy = -Math.cos(a), vx = -uy, vy = ux;      // diamond pointing at the centre
  c.d.goal.setAttribute('d', `M${x - ux * 5} ${y - uy * 5}L${x + vx * 3.5} ${y + vy * 3.5}L${x + ux * 3} ${y + uy * 3}L${x - vx * 3.5} ${y - vy * 3.5}Z`);
}

function setMeter(m, frac, text, colorFrac, tripFrac, timerFrac) {
  m.querySelector('output').textContent = text;
  const f = m.querySelector('.fill');
  f.style.width = (100 * Math.min(1, Math.max(0, frac))) + '%';
  f.style.background = effortColor(colorFrac);
  m.querySelector('.trip').style.left = (100 * tripFrac) + '%';
  const t = m.querySelector('.timer'); if (t) t.style.width = (100 * (timerFrac || 0)) + '%';
}

function renderChannels() {
  const stallA = MODEL.servo.stall_a, ocA = MODEL.servo.overcurrent_a;
  for (const js of S.joints) {
    const j = MODEL.joints.indexOf(js.name), c = CH[j], d = c.d;
    if (!c.rng) {
      c.rng = js.range;
      d.range.setAttribute('d', arc(js.range[0], js.range[1], R));
      const [x0, y0] = pt(0, R - 6), [x1, y1] = pt(0, R + 4);
      setAttrs(d.zero, { x1: x0, y1: y0, x2: x1, y2: y1 });
    }
    d.lag.setAttribute('d', arc(js.q, js.goal, R));
    d.lag.style.display = js.torque && Math.abs(js.goal - js.q) > 0.3 ? '' : 'none';
    const [sx0, sy0] = pt(js.sp, R - 5), [sx1, sy1] = pt(js.sp, R + 5);
    setAttrs(d.sp, { x1: sx0, y1: sy0, x2: sx1, y2: sy1 });
    const [nx, ny] = pt(js.q, R - 3);
    setAttrs(d.needle, { x1: CX, y1: CY, x2: nx, y2: ny });
    if (!c.dragging && !(js.name in pendingGoal)) drawGoal(c, js.goal);
    d.goal.setAttribute('opacity', js.torque ? 1 : 0.25);

    c.g.textContent = fmt(js.goal) + '°'; c.a.textContent = fmt(js.q) + '°';
    c.g.style.visibility = js.torque ? '' : 'hidden';

    const duty = Math.abs(js.duty) / 100, ol = js.overload_pct / 100;
    setMeter(c.m[0], duty, Math.abs(js.duty).toFixed(0) + '%', js.faults.includes('overload') ? 1 : Math.max(duty / ol * 0.85, js.ol_frac > 0 ? 0.7 : 0), ol, js.faults.length ? 0 : js.ol_frac);
    const cur = Math.abs(js.current);
    setMeter(c.m[1], cur / stallA, cur.toFixed(2) + 'A', js.faults.includes('overcurrent') ? 1 : Math.max(cur / ocA * 0.85, js.oc_frac > 0 ? 0.7 : 0), ocA / stallA, js.faults.length ? 0 : js.oc_frac);
    const tLo = 20, tHi = js.max_temp + 10;
    setMeter(c.m[2], (js.temp - tLo) / (tHi - tLo), js.temp.toFixed(0) + '°C', js.faults.includes('overheat') ? 1 : (js.temp - tLo) / (js.max_temp - tLo), (js.max_temp - tLo) / (tHi - tLo));

    const fault = js.faults.length > 0, near = !fault && (js.ol_frac > 0 || js.oc_frac > 0);
    c.row.classList.toggle('fault', fault); c.row.classList.toggle('near', near);
    c.f.textContent = fault ? js.faults.map(f => FAULT_JA[f] || f).join('・') : '';
  }
}

// velocity over time for a 90 deg move with the current speed / acceleration settings
const NO_LIMIT_V = 3400, NO_LIMIT_A = 2.0e5;            // what the servo model uses for "0"
function drawProfile() {
  const cv = $('prof'), d = Math.min(2, devicePixelRatio), W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  if (cv.width !== W * d) { cv.width = W * d; cv.height = H * d; }
  const x = cv.getContext('2d'); x.setTransform(d, 0, 0, d, 0, 0); x.clearRect(0, 0, W, H);
  const vIn = Number(document.querySelector('[data-reg=Goal_Velocity]').value);
  const aIn = Number(document.querySelector('[data-reg=Acceleration]').value);
  const v = (vIn >= 3400 ? NO_LIMIT_V : vIn) * TICK_DEG, a = (aIn >= 254 ? NO_LIMIT_A : aIn * 100) * TICK_DEG;
  const dist = 90;
  const vp = Math.min(v, Math.sqrt(a * dist)), ta = vp / a, tc = Math.max(0, (dist - vp * ta) / vp), T = 2 * ta + tc;

  x.strokeStyle = css('--border'); x.lineWidth = 1; x.beginPath(); x.moveTo(6, H - 7.5); x.lineTo(W - 6, H - 7.5); x.stroke();
  x.beginPath(); x.moveTo(X(0), Y(0)); x.lineTo(X(ta), Y(vp)); x.lineTo(X(ta + tc), Y(vp));
  x.lineTo(X(T), T <= Tmax ? Y(0) : Y(vp));
  x.strokeStyle = css('--c-goal'); x.lineWidth = 1.5; x.stroke();
  x.lineTo(X(T), Y(0)); x.closePath(); x.globalAlpha = 0.18; x.fillStyle = css('--c-goal'); x.fill(); x.globalAlpha = 1;

}

    m.position.fromArray(g.pos); m.quaternion.set(g.quat[1], g.quat[2], g.quat[3], g.quat[0]);
    m.castShadow = true; m.receiveShadow = true; m.userData.joint = MODEL.body_joint[g.body];
    bodyGroups[g.body].add(m); pickables.push(m);
    if (MODEL.body_joint[g.body] >= 0) {
      const gm = new THREE.Mesh(GEOS[g.mesh], ghostMat);
      gm.position.copy(m.position); gm.quaternion.copy(m.quaternion); gm.renderOrder = 2;
      ghostGroups[g.body].add(gm);
    }
  }
  selRing = new THREE.Mesh(new THREE.TorusGeometry(0.03, 0.0011, 8, 72), new THREE.MeshBasicMaterial({ color: COL.accent, depthTest: false, transparent: true, opacity: 0.9 }));
  selRing.renderOrder = 3; world.add(selRing);
  payloadMesh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.03), new THREE.MeshStandardMaterial({ color: 0x6e6e72, roughness: 0.8 }));
  payloadMesh.castShadow = true; world.add(payloadMesh);
}

function highlight() {
  if (!bodyMats.length) return;
  MODEL.body_joint.forEach((j, b) => {
    for (const m of Object.values(bodyMats[b])) { m.emissive.copy(j === sel ? COL.accent : COL.black); m.emissiveIntensity = j === sel ? 0.2 : 0; }
  });
}

const contactGeo = new THREE.SphereGeometry(1, 12, 8);
const contactMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(css('--danger-text')) });
function renderArm() {
  setPose(bodyGroups, S.bodies); setPose(ghostGroups, S.ghost);
  ghostRoot.visible = ghostOn && S.joints[0].torque && Math.max(...S.joints.map(j => Math.abs(j.goal - j.q))) > 0.3;
  while (contactMeshes.length < S.floor.contacts.length) { const m = new THREE.Mesh(contactGeo, contactMat); world.add(m); contactMeshes.push(m); }
  contactMeshes.forEach((m, i) => {
    const c = S.floor.contacts[i]; m.visible = !!c;
    if (c) { m.position.set(c[0], c[1], c[2] + 0.001); m.scale.setScalar(0.003 + Math.min(0.006, c[3] * 0.002)); }
  });
  payloadMesh.visible = S.payload_kg > 0;
  if (payloadMesh.visible) { payloadMesh.position.set(S.tcp[0], S.tcp[1], S.tcp[2] - 0.02); payloadMesh.scale.setScalar(0.6 + S.payload_kg * 1.2); }
  const b = MODEL.body_joint.indexOf(sel);
  if (b >= 0) { selRing.position.copy(bodyGroups[b].position); selRing.quaternion.copy(bodyGroups[b].quaternion); }
}
$('ghostBtn').onclick = () => { ghostOn = !ghostOn; $('ghostBtn').classList.toggle('on', ghostOn); };
$('viewBtn').onclick = resetView;

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit && hit.object.userData.joint >= 0) select(hit.object.userData.joint);
});

const tmpV = new THREE.Vector3();
function placeLabel() {
  const lab = $('selLabel');
  selRing.getWorldPosition(tmpV); tmpV.project(camera);
  const r = renderer.domElement.getBoundingClientRect();
  lab.style.left = ((tmpV.x + 1) / 2 * r.width + 22) + 'px';
  lab.style.top = ((1 - tmpV.y) / 2 * r.height) + 'px';
  lab.textContent = fmt(S.joints[sel].q) + '°';
}
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.render(scene, camera);                            // no blank frame between resize and the next tick
}
new ResizeObserver(resize).observe(view);

/* ============================== trace ============================== */
const cv = $('traceCv'), cx = cv.getContext('2d');
function sizeTrace() {
  const r = $('trace').getBoundingClientRect(), d = Math.min(2, devicePixelRatio);
  cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0);
}
new ResizeObserver(sizeTrace).observe($('trace'));

function drawTrace() {
  const W = cv.clientWidth, H = cv.clientHeight;
  cx.clearRect(0, 0, W, H);
  if (!hist.length) return;
  const L = 96, Rm = 70, top = 12, gap = 14, bot = 22;
  const h1 = (H - top - gap - bot) * 0.62, h2 = (H - top - gap - bot) * 0.38;
  const y1 = top, y2 = top + h1 + gap;
  const tEnd = hist[hist.length - 1][0], span = 10, tBeg = tEnd - span;
  const X = t => L + (t - tBeg) / span * (W - L - Rm);
  const base = 1 + sel * 5;
  const rows = hist.filter(r => r[0] >= tBeg && r[0] <= tEnd);
  if (!rows.length) return;
  let lo = Infinity, hi = -Infinity;
  for (const r of rows) for (const k of [0, 1, 2]) { lo = Math.min(lo, r[base + k]); hi = Math.max(hi, r[base + k]); }
  const pad = Math.max(2, (hi - lo) * 0.12); lo -= pad; hi += pad;
  const Y1 = v => y1 + h1 - (v - lo) / (hi - lo) * h1;
  const curMax = MODEL.servo.stall_a;
  const Yd = v => y2 + h2 - Math.min(1, Math.abs(v) / 100) * h2;
  const Yc = v => y2 + h2 - Math.min(1, Math.abs(v) / curMax) * h2;

  cx.font = `10px ${css('--font-mono')}`;
  cx.fillStyle = css('--surface'); cx.fillRect(L, y1, W - L - Rm, h1); cx.fillRect(L, y2, W - L - Rm, h2);
  cx.textAlign = 'center';
  for (let t = Math.ceil(tBeg); t <= tEnd; t++) {
    const x = X(t);
    cx.fillStyle = css('--divider'); cx.fillRect(x, y1, 1, h1); cx.fillRect(x, y2, 1, h2);
    cx.fillStyle = css('--text-faint'); cx.fillText(`${(t - tEnd).toFixed(0)}s`, x, y2 + h2 + 14);
  }
  cx.textAlign = 'right';
  cx.fillText(`${hi.toFixed(0)}°`, L - 6, y1 + 9); cx.fillText(`${lo.toFixed(0)}°`, L - 6, y1 + h1);
  cx.fillText('100%', L - 6, y2 + 9);
  cx.fillStyle = css('--c-cur'); cx.fillText(`${curMax}A`, L - 6, y2 + 20);
  // overload threshold
  const ol = S.joints[sel].overload_pct;
  cx.strokeStyle = css('--danger-text'); cx.globalAlpha = 0.6; cx.setLineDash([3, 3]); cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(L, Yd(ol) + 0.5); cx.lineTo(W - Rm, Yd(ol) + 0.5); cx.stroke();
  cx.setLineDash([]); cx.globalAlpha = 1;

  // output as an area, current as a line, angles as lines
  cx.fillStyle = 'rgba(157,157,157,.22)';
  cx.beginPath(); cx.moveTo(X(rows[0][0]), Yd(0));
  rows.forEach(r => cx.lineTo(X(r[0]), Yd(r[base + 3])));
  cx.lineTo(X(rows[rows.length - 1][0]), Yd(0)); cx.closePath(); cx.fill();
  const line = (k, Y, color, w, dash) => {
    cx.strokeStyle = color; cx.lineWidth = w; cx.setLineDash(dash || []);
    cx.beginPath(); rows.forEach((r, i) => { const x = X(r[0]), y = Y(r[base + k]); i ? cx.lineTo(x, y) : cx.moveTo(x, y); });
    cx.stroke(); cx.setLineDash([]);
  };
  line(4, Yc, css('--c-cur'), 1.2);
  line(1, Y1, css('--c-sp'), 1);
  line(0, Y1, css('--c-goal'), 1.5, [5, 3]);
  line(2, Y1, css('--c-act'), 2);
  // end-of-line values in the line's own colour
  const last = rows[rows.length - 1];
  const tags = [[fmt(last[base]) + '°', Y1(last[base]), css('--c-goal')], [fmt(last[base + 2]) + '°', Y1(last[base + 2]), css('--c-act')]].sort((a, b) => a[1] - b[1]);
  if (tags[1][1] - tags[0][1] < 12) tags[1][1] = tags[0][1] + 12;
  cx.textAlign = 'left';
  tags.forEach(([t, y, c]) => { cx.fillStyle = c; cx.fillText(t, W - Rm + 6, y + 4); });
  const yd = Yd(last[base + 3]) + 4;
  cx.fillStyle = css('--text-muted'); cx.fillText(`${Math.abs(last[base + 3]).toFixed(0)}%`, W - Rm + 6, yd);
  cx.fillStyle = css('--c-cur'); cx.fillText(`${Math.abs(last[base + 4]).toFixed(2)}A`, W - Rm + 6, Math.max(yd + 12, Yc(last[base + 4]) + 4));
}

/* ============================== loop ============================== */
async function poll() {
  for (;;) {
    try {
      S = await (await fetch('/api/state?since=' + seq)).json();
      seq = S.seq;
      for (const row of S.hist) {
        if (hist.length && row[0] < hist[hist.length - 1][0]) hist.length = 0;   // the sim was rebuilt
        hist.push(row);
      }
      if (hist.length > HIST_KEEP) hist.splice(0, hist.length - HIST_KEEP);
      renderChannels(); renderCommands(); renderArm();
    } catch (e) {
      console.error(e);
      const st = $('armState'); st.className = 'state err'; st.innerHTML = icon('i-power'); st.title = 'サーバに繋がりません';
      await new Promise(r => setTimeout(r, 1000));
    }
    await new Promise(r => setTimeout(r, 30));
  }
}
function frame() {
  controls.update();
  if (S) { placeLabel(); drawTrace(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

(async () => {
  MODEL = await (await fetch('/api/model')).json();
  const ids = [...new Set(MODEL.geoms.map(g => g.mesh))];
  await Promise.all(ids.map(async id => { GEOS[id] = await loadMesh(id); }));
  const poseImgs = makeThumbs();
  buildFloor(MODEL.floor_z);
  buildChannels(); buildCommands(poseImgs);
  buildArm();
  S = await (await fetch('/api/state?since=0')).json();
  resetView(); resize(); sizeTrace();
  select(sel);
  S = null;
  poll(); frame();
})();
</script>
</body>
