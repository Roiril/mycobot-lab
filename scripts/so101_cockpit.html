<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO-101 コックピット</title>
<style>
/* Design tokens: manual copy of scripts/ui.html :root (single-file rule —
   see .agent/rules/design.md; update both when tokens change) */
:root{
  --bg:#1e1e1e; --surface:#252526; --surface-2:#2d2d30; --surface-3:#333334;
  --border:#3c3c3c; --border-strong:#525257; --divider:#2b2b2c;
  --text:#d4d4d4; --text-muted:#9d9d9d; --text-faint:#6e6e72; --text-inv:#ffffff;
  --accent:#4ec9ff; --accent-bg:#0e639c; --accent-bg-hover:#1177bb;
  --accent-soft:rgba(78,201,255,.13); --accent-line:rgba(78,201,255,.30);
  --ok:#388a5a; --ok-text:#4ec99a;
  --warn:#9a7d12; --warn-text:#dcdcaa;
  --danger:#a1260d; --danger-hover:#c5341a; --danger-text:#f14c4c; --danger-soft:rgba(161,38,13,.16);
  --data-num:#9cdcfe; --data-tgt:#ce9178; --data-ok:#6a9955;
  --font-ui:system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  --fs-2xs:10px; --fs-xs:11px; --fs-sm:12px; --fs-base:13px; --fs-md:15px;
  --fw-reg:400; --fw-med:600; --fw-bold:700;
  --radius:4px; --radius-sm:3px; --bw:1px;
  --pad:11px; --gap:8px;
  --t-fast:.1s; --t-std:.16s; --ease:ease-out;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:var(--fs-base)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
#wrap{max-width:1080px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}

/* simulation banner: cannot be dismissed, so a sim run is never read as hardware */
#simBanner{display:none;background:var(--warn);color:var(--text-inv);font-weight:var(--fw-bold);
  border-radius:var(--radius);padding:6px var(--pad);font-size:var(--fs-sm)}

/* status bar */
#statusBar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--surface);border:var(--bw) solid var(--border);border-radius:var(--radius);
  padding:8px var(--pad)}
#statusBar .title{font-weight:var(--fw-bold);font-size:var(--fs-md)}
.badge{font-size:var(--fs-2xs);font-weight:var(--fw-bold);padding:2px 8px;border-radius:var(--radius-sm);
  letter-spacing:.4px;white-space:nowrap}
.badge.ok{background:var(--ok);color:var(--text-inv)}
.badge.err{background:var(--danger);color:var(--text-inv)}
.badge.warn{background:var(--warn);color:var(--text-inv)}
.badge.gray{background:var(--surface-3);color:var(--text-muted);border:var(--bw) solid var(--border)}
.badge.accent{background:var(--accent-soft);color:var(--accent);border:var(--bw) solid var(--accent-line)}
#statusBar .spacer{flex:1}

button{background:var(--surface-3);color:var(--text);border:var(--bw) solid var(--border);
  padding:6px 11px;border-radius:var(--radius);cursor:pointer;
  font:var(--fw-med) var(--fs-base) var(--font-ui);
  transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
button:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-strong)}
button:active:not(:disabled){transform:translateY(.5px)}
button:disabled{background:var(--surface);color:var(--text-faint);cursor:not-allowed;opacity:.6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--text-inv)}
button.primary:hover:not(:disabled){background:var(--accent-bg-hover)}
button.abort{background:var(--danger);border-color:var(--danger);color:var(--text-inv);font-weight:var(--fw-bold)}
button.abort:hover:not(:disabled){background:var(--danger-hover)}
button.toggle.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
button.sm{padding:3px 8px;font-size:var(--fs-xs)}

/* operator message: one line, the most important thing right now */
#msgBar{display:none;border-radius:var(--radius);padding:8px var(--pad);font-size:var(--fs-base);
  border:var(--bw) solid var(--border);background:var(--surface)}
#msgBar.info{display:block;border-left:3px solid var(--accent-line)}
#msgBar.warn{display:block;border-left:3px solid var(--warn);color:var(--warn-text)}
#msgBar.danger{display:block;border-left:3px solid var(--danger);color:var(--danger-text);
  background:var(--danger-soft)}

/* follow row */
#teleopRow{display:flex;align-items:center;gap:10px;background:var(--surface);flex-wrap:wrap;
  border:var(--bw) solid var(--border);border-left:3px solid var(--accent-line);
  border-radius:var(--radius);padding:var(--pad)}
#teleopRow .desc{color:var(--text-muted);font-size:var(--fs-sm);flex:1;min-width:200px}
.group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.group .glabel{font-size:var(--fs-xs);color:var(--text-muted)}

/* ✋ HMD hand-teleop launch row (independent of the SO-101 serial bus) */
#handRow{display:flex;align-items:center;gap:10px;background:var(--surface);
  border:var(--bw) solid var(--border);border-left:3px solid var(--accent-line);
  border-radius:var(--radius);padding:var(--pad);flex-wrap:wrap}
#handRow .desc{color:var(--text-muted);font-size:var(--fs-sm);min-width:0;flex:1}
#handRow .desc.bad{color:var(--danger-text)}
#handRow .desc.good{color:var(--ok-text)}
#handRow .handbadges{display:flex;gap:6px;flex-shrink:0}

/* arm panels */
#arms{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px}
@media (max-width:860px){#arms{grid-template-columns:1fr}}
.panel{background:var(--surface);border:var(--bw) solid var(--border);
  border-radius:var(--radius);padding:var(--pad)}
h2{font-size:var(--fs-xs);font-weight:var(--fw-bold);margin:0 0 8px;color:var(--text-muted);
  letter-spacing:.6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
h2 .arm-name{color:var(--text);font-size:var(--fs-sm)}

.joint{display:grid;grid-template-columns:92px 1fr 80px;gap:4px 6px;align-items:center;
  padding:6px 0;border-bottom:var(--bw) solid var(--divider)}
.joint:last-of-type{border-bottom:none}
.joint .name{font-size:var(--fs-xs);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joint .name .tq{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
  background:var(--surface-3);border:var(--bw) solid var(--border-strong);vertical-align:1px}
.joint .name .tq.on{background:var(--ok);border-color:var(--ok)}
.bar{position:relative;height:14px;background:var(--bg);border:var(--bw) solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden}
.bar .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--accent-soft)}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.bar .goal{position:absolute;top:0;bottom:0;width:2px;background:var(--data-tgt);opacity:.9}
.joint .val{font-family:var(--font-mono);font-size:var(--fs-sm);color:var(--data-num);text-align:right;white-space:nowrap}
.joint .val .u{color:var(--text-faint);font-size:var(--fs-2xs)}
.joint input[type=range]{width:100%;accent-color:var(--accent-bg);height:14px;margin:2px 0 0}
.joint.stale .val,.joint.stale .bar{opacity:.45}

/* second line of a follower joint: state, output meter, current, temperature */
.jstat{grid-column:1 / -1;display:grid;grid-template-columns:92px 1fr 80px;gap:6px;align-items:center}
.jstat .st{justify-self:start}
.jstat .reason{grid-column:1 / -1;font-size:var(--fs-2xs);color:var(--text-muted);display:none}
.jstat .reason.on{display:block}
.meterwrap{display:flex;align-items:center;gap:6px}
.meter{position:relative;flex:1;height:8px;background:var(--bg);border:var(--bw) solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden}
.meter .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--accent-line)}
.meter .fill.mid{background:var(--warn)}
.meter .fill.high{background:var(--danger)}
.meter .mark{position:absolute;top:0;bottom:0;left:80%;width:1px;background:var(--text-faint)}
.meterwrap .num{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);
  min-width:34px;text-align:right}
.jstat .phys{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-muted);text-align:right;
  white-space:nowrap}

.armfoot{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.armfoot .meta{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-faint);margin-left:auto}
.hot{color:var(--warn-text)}
.vlow,.vhot{color:var(--danger-text)}

/* findings + log */
#findings ul{margin:0;padding-left:18px;font-size:var(--fs-sm)}
#findings li.error{color:var(--danger-text)}
#findings li.warn{color:var(--warn-text)}
#findings li.info{color:var(--text-muted)}
#log{font-family:var(--font-mono);font-size:var(--fs-xs);max-height:160px;overflow:auto;
  display:flex;flex-direction:column-reverse;gap:1px}
#log .t{color:var(--text-faint);margin-right:8px}
#metrics{font-family:var(--font-mono);font-size:var(--fs-2xs);color:var(--text-faint)}
</style>
</head>
<body>
<div id="wrap">
  <div id="simBanner">シミュレーション — 実機ではありません。表示の数値はモデルの値です</div>

  <div id="statusBar">
    <span class="title">🦾 SO-101 コックピット</span>
    <span id="connBadge" class="badge gray">接続中…</span>
    <span id="teleopBadge" class="badge gray">追従 OFF</span>
    <span id="govBadge" class="badge gray" title="負荷と温度による自動調整">自動調整</span>
    <span class="spacer"></span>
    <button id="coolBtn" title="腕を立てて保持トルクをほぼ 0 にし、サーボを冷ます（12°/s でゆっくり動きます）">冷却姿勢</button>
    <button id="relaxBtn" title="フォロワー全関節のトルクを切る（アームは脱力して落ちます）">🧊 脱力</button>
    <button id="abortBtn" class="abort">⛔ ABORT (Esc)</button>
  </div>

  <div id="msgBar"></div>

  <div id="teleopRow">
    <button id="teleopBtn" class="toggle">追従モード</button>
    <button id="autoBtn" class="toggle" title="リーダーをフォロワーの姿勢に合わせると自動で追従を開始">自動追従</button>
    <span id="teleopDesc" class="desc">ON でフォロワーがリーダーを追従します。何かに当たると押すのをやめ、熱くなると止まります。
      OFF でその場の姿勢を保持。個別ジョグは OFF のときだけ有効。</span>
    <div class="group" id="speedGroup"><span class="glabel">速さ</span></div>
  </div>

  <div id="handRow">
    <button id="handLaunchBtn" title="接続中の Quest でハンド操作VR（被るだけ）を起動">🥽 HMDでハンド操作</button>
    <span id="handMsg" class="desc">被るだけでロボットハンドを操作できます。</span>
    <span class="handbadges">
      <span id="handSrvBadge" class="badge gray" title="ハンドサーバ :8001 の死活">ハンド:確認中</span>
      <span id="handMcuBadge" class="badge gray" title="ハンド MCU（ATOM Lite）の応答">MCU:--</span>
    </span>
  </div>

  <div id="arms">
    <div class="panel" id="leaderPanel">
      <h2><span class="arm-name">🎮 リーダー（<span id="leaderPort">検出中</span> / 7.4V系）</span><span id="leaderVolt" class="badge gray">--V</span></h2>
      <div id="leaderJoints"></div>
      <div class="armfoot">
        <button class="sm" data-arm="leader" data-tq="0">全脱力</button>
        <button class="sm" data-arm="leader" data-tq="1">全トルクON</button>
        <span class="meta" id="leaderMeta"></span>
      </div>
    </div>
    <div class="panel" id="followerPanel">
      <h2><span class="arm-name">🦾 フォロワー（<span id="followerPort">検出中</span> / 12V）</span><span id="followerVolt" class="badge gray">--V</span></h2>
      <div id="followerJoints"></div>
      <div class="armfoot">
        <button class="sm" data-arm="follower" data-tq="0">全脱力</button>
        <button class="sm" data-arm="follower" data-tq="1">全トルクON</button>
        <span class="meta" id="followerMeta"></span>
      </div>
    </div>
  </div>

  <div class="panel" id="findings" style="display:none">
    <h2>サーボ設定の確認</h2>
    <ul id="findingsList"></ul>
  </div>

  <div class="panel">
    <h2>イベントログ<span id="metrics"></span></h2>
    <div id="log"></div>
  </div>
</div>

<script>
const JOINTS=["shoulder_pan","shoulder_lift","elbow_flex","wrist_flex","wrist_roll","gripper"];
const JLABEL={shoulder_pan:"土台 pan",shoulder_lift:"肩 lift",elbow_flex:"肘 flex",
  wrist_flex:"手首 flex",wrist_roll:"手首 roll",gripper:"グリッパ"};
// governor state -> [label, badge class]
const STATE_JA={track:["追従","gray"],hold:["当たり","warn"],probe:["確認中","warn"],
  load:["重い","warn"],grip:["把持","accent"],protect:["保護","err"],off:["脱力","gray"],
  stale:["読めない","err"]};
let ranges=null, teleop=false, autoArmed=false, dragging=null, speed=null, speedBuilt=false;
const TELEOP_DESC=document.getElementById("teleopDesc").textContent;

function post(path,body){return fetch(path,{method:"POST",body:JSON.stringify(body||{})});}
// homed ticks -> degrees, lerobot DEGREES semantics (0 deg = calibrated range centre)
function deg(n,r){
  const [lo,hi]=ranges&&ranges[n]?ranges[n]:[0,4095];
  return (r-(lo+hi)/2)*360/4095;
}
const pctOf=(n,r)=>{const [lo,hi]=ranges&&ranges[n]?ranges[n]:[0,4095];
  return Math.max(0,Math.min(100,(r-lo)/(hi-lo)*100));};
const $=id=>document.getElementById(id);

function buildJoints(arm){
  const host=$(arm+"Joints");
  host.innerHTML="";
  for(const n of JOINTS){
    const row=document.createElement("div"); row.className="joint"; row.id=`${arm}-${n}-row`;
    const follower=arm==="follower";
    row.innerHTML=`
      <span class="name"><span class="tq" id="${arm}-${n}-tq"></span>${JLABEL[n]}</span>
      <div>
        <div class="bar"><div class="fill" id="${arm}-${n}-fill"></div>
          ${follower?`<div class="goal" id="${arm}-${n}-goal"></div>`:""}
          <div class="tick" id="${arm}-${n}-tick"></div></div>
        ${follower?`<input type="range" id="${arm}-${n}-slider" min="0" max="4095" step="1" aria-label="${JLABEL[n]} ジョグ">`:""}
      </div>
      <span class="val"><span id="${arm}-${n}-deg">--</span><span class="u">°</span>
        <span class="u" id="${arm}-${n}-extra"></span></span>
      ${follower?`<div class="jstat">
        <span class="badge gray st" id="${arm}-${n}-st">--</span>
        <div class="meterwrap" title="出力（モータ駆動のデューティ）。印は過負荷保護の目安 80%">
          <div class="meter"><div class="fill" id="${arm}-${n}-duty"></div><div class="mark"></div></div>
          <span class="num" id="${arm}-${n}-dutyn">--</span></div>
        <span class="phys" id="${arm}-${n}-phys" title="電流（2 秒間の最大）と温度">--</span>
        <span class="reason" id="${arm}-${n}-reason"></span>
      </div>`:""}`;
    host.appendChild(row);
    if(follower){
      const s=row.querySelector("input");
      s.addEventListener("input",()=>{dragging=n; post("/jog",{joint:n,pos:+s.value});});
      s.addEventListener("change",()=>{setTimeout(()=>{if(dragging===n)dragging=null;},400);});
    }
  }
}
buildJoints("leader"); buildJoints("follower");

$("teleopBtn").onclick=()=>post("/teleop",{on:!teleop});
$("autoBtn").onclick=()=>post("/auto_follow",{on:!autoArmed});
$("abortBtn").onclick=()=>post("/abort",{});
$("relaxBtn").onclick=()=>{
  if(confirm("アームが脱力して落ちます。手で支えるか、置いてから実行してください。"))
    post("/relax",{});
};
$("coolBtn").onclick=()=>{
  if(confirm("腕を立てて冷却姿勢へゆっくり移動します（約 10 秒）。周りに物や手がないことを確認してください。"))
    post("/retreat",{});
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")post("/abort",{});});
document.querySelectorAll("[data-tq]").forEach(b=>{
  b.onclick=()=>post("/torque",{arm:b.dataset.arm,joint:"all",on:b.dataset.tq==="1"});
});

function buildSpeed(presets){
  const g=$("speedGroup");
  for(const [key,label] of Object.entries(presets)){
    const b=document.createElement("button");
    b.className="toggle sm"; b.textContent=label; b.dataset.speed=key;
    b.onclick=()=>post("/speed",{preset:key});
    g.appendChild(b);
  }
  speedBuilt=true;
}

function paintLeader(data){
  let vmin=99, tmax=0; const stale=[];
  for(const n of JOINTS){
    const d=data[n]; if(!d) continue;
    const row=$(`leader-${n}-row`);
    row.classList.toggle("stale",!!d.stale||d.pos==null);
    if(d.pos!=null){
      const pct=pctOf(n,d.pos);
      $(`leader-${n}-fill`).style.width=pct+"%";
      $(`leader-${n}-tick`).style.left=`calc(${pct}% - 1px)`;
      $(`leader-${n}-deg`).textContent=deg(n,d.pos).toFixed(1);
    }
    $(`leader-${n}-tq`).className="tq"+(d.torque?" on":"");
    const ex=$(`leader-${n}-extra`);
    ex.textContent=d.temp?` ${d.temp}℃`:"";
    if(d.stale)stale.push(n);
    if(d.volt)vmin=Math.min(vmin,d.volt);
    tmax=Math.max(tmax,d.temp||0);
  }
  const vb=$("leaderVolt");
  if(vmin<99){vb.textContent=vmin.toFixed(1)+"V"; vb.className="badge "+(vmin<5?"err":"ok");}
  $("leaderMeta").textContent=`max ${tmax}℃`+(stale.length?` ⚠ ${stale.join(",")} 読めない`:"");
}

function paintFollower(data,arm){
  let tmax=0; const stale=[];
  for(const n of JOINTS){
    const d=data[n]; if(!d) continue;
    const row=$(`follower-${n}-row`);
    row.classList.toggle("stale",!!d.stale);
    const pct=pctOf(n,d.pos), gp=pctOf(n,d.goal);
    $(`follower-${n}-fill`).style.width=pct+"%";
    $(`follower-${n}-tick`).style.left=`calc(${pct}% - 1px)`;
    $(`follower-${n}-goal`).style.left=`calc(${gp}% - 1px)`;
    $(`follower-${n}-deg`).textContent=deg(n,d.pos).toFixed(1);
    $(`follower-${n}-tq`).className="tq"+(d.torque?" on":"");
    const [label,cls]=STATE_JA[d.state]||[d.state,"gray"];
    const st=$(`follower-${n}-st`);
    st.textContent=label; st.className="badge st "+cls; st.title=d.reason||"";
    const duty=Math.max(0,Math.min(1000,d.duty||0));
    const f=$(`follower-${n}-duty`);
    f.style.width=(duty/10)+"%";
    f.className="fill"+(duty>=800?" high":(duty>=600?" mid":""));
    $(`follower-${n}-dutyn`).textContent=Math.round(duty/10)+"%";
    const ph=$(`follower-${n}-phys`);
    const imax=d.current_max||0;
    ph.innerHTML=`<span class="${imax>=1.6?"vhot":""}">${imax.toFixed(2)}A</span> `+
      `<span class="${d.temp>=62?"vhot":(d.temp>=55?"hot":"")}">${d.temp}℃</span>`;
    const rs=$(`follower-${n}-reason`);
    const showReason=d.reason&&!["track","off"].includes(d.state);
    rs.textContent=showReason?d.reason:""; rs.classList.toggle("on",!!showReason);
    $(`follower-${n}-extra`).textContent=(d.faults&&d.faults.length)?" ⚠":"";
    if(!dragging){
      const s=$(`follower-${n}-slider`);
      if(s&&document.activeElement!==s)s.value=d.goal;
    }
    if(d.stale)stale.push(n);
    tmax=Math.max(tmax,d.temp||0);
  }
  const vb=$("followerVolt");
  if(arm.supply_v){
    vb.textContent=arm.supply_v.toFixed(1)+"V";
    vb.className="badge "+(arm.supply_v<10.8?"err":(arm.supply_v<11.3?"warn":"ok"));
  }
  const th={ok:"",warn:"温まっています",alert:"高温",stop:"高温で停止",retreat:"冷却中"}[arm.thermal]||"";
  $("followerMeta").textContent=`サーボ電流の合計 ${(arm.current_sum||0).toFixed(2)}A / max ${tmax}℃`+
    (th?` / ${th}`:"")+(stale.length?` ⚠ ${stale.join(",")} 読めない`:"");
}

function paintPorts(st){
  const p=st.ports||{};
  for(const arm of ["leader","follower"]){
    const el=$(arm+"Port");
    const dev=p[arm]||"検出中";
    // 実測（電圧）で確定したポートだけ無印。記憶や手動指定は要確認として出す。
    el.textContent=p[arm]?(p.confirmed?dev:dev+"?"):dev;
    el.title=p.detail||"";
  }
}

function paintAuto(st){
  const a=st.auto_follow||{};
  autoArmed=!!a.armed;
  const btn=$("autoBtn");
  btn.classList.toggle("active",autoArmed);
  btn.textContent=autoArmed?"自動追従 待機中":"自動追従";
  $("teleopDesc").textContent=(autoArmed&&a.status)?a.status:TELEOP_DESC;
}

function paintMessage(st){
  const arm=st.arm||{};
  const bar=$("msgBar");
  let text=arm.message||"", level=arm.message_level||"info";
  if(!text&&arm.follow_allowed===false&&arm.stop_reason){text=arm.stop_reason; level="danger";}
  if(!text&&st.error){text=st.error; level="danger";}
  bar.textContent=text; bar.className=text?level:"";
}

function paintFindings(list){
  const box=$("findings");
  const order={error:0,warn:1,info:2};
  const items=(list||[]).slice().sort((a,b)=>order[a.level]-order[b.level]);
  box.style.display=items.length?"block":"none";
  $("findingsList").innerHTML=items.map(f=>
    `<li class="${f.level}">${f.servo==="*"?"全体":JLABEL[f.servo]||f.servo}: ${f.message}</li>`).join("");
}

function paintMetrics(st){
  const e=st.engine||{};
  const miss=Object.entries(e.io_missing||{}).filter(([,v])=>v>0).map(([k,v])=>`${k}:${v}`).join(" ");
  $("metrics").textContent=`${(st.hz||0).toFixed(0)}Hz  p99 ${e.cycle_ms_p99??"-"}ms  `+
    `timeout ${e.io_timeouts??0}`+(miss?`  欠け ${miss}`:"");
  const gb=$("govBadge");
  if(e.governor_mode==="shadow"){
    gb.textContent="自動調整: 表示のみ"; gb.className="badge warn";
    gb.title=e.instrument_detail||"計器チェックが通らなかったため、判定の表示だけ行っています";
  }else{
    gb.textContent="自動調整 ON"; gb.className="badge accent"; gb.title="負荷と温度による自動調整";
  }
}

async function poll(){
  try{
    const st=await(await fetch("/state")).json();
    ranges=st.ranges||ranges;
    teleop=st.teleop;
    $("simBanner").style.display=st.source==="sim"?"block":"none";
    if(!speedBuilt&&st.speed_presets)buildSpeed(st.speed_presets);
    const arm=st.arm||{};
    document.querySelectorAll("#speedGroup [data-speed]").forEach(b=>
      b.classList.toggle("active",b.dataset.speed===arm.speed));
    const cb=$("connBadge");
    const waiting=!st.connected&&!(st.ports&&st.ports.leader);
    cb.textContent=st.connected?"接続OK":(waiting?"USB 待機中":"バス断");
    cb.className="badge "+(st.connected?"ok":(waiting?"warn":"err"));
    const tb=$("teleopBadge");
    tb.textContent=st.retreating?"冷却姿勢へ移動中":(st.teleop?"追従 ON":"追従 OFF");
    tb.className="badge "+(st.retreating?"warn":(st.teleop?"accent":"gray"));
    const btn=$("teleopBtn");
    btn.classList.toggle("active",st.teleop);
    btn.textContent=st.teleop?"追従モード ON":"追従モード";
    document.querySelectorAll("#followerJoints input[type=range]").forEach(s=>s.disabled=st.teleop||st.retreating);
    paintPorts(st);
    paintAuto(st);
    paintMessage(st);
    paintMetrics(st);
    paintFindings(st.findings);
    if(st.leader)paintLeader(st.leader);
    if(st.follower)paintFollower(st.follower,arm);
    $("log").innerHTML=(st.log||[]).map(
      e=>`<div><span class="t">${e.t}</span>${e.msg}</div>`).reverse().join("");
  }catch(e){
    const cb=$("connBadge");
    cb.textContent="サーバ停止"; cb.className="badge err";
  }
  setTimeout(poll,150);
}
poll();

// ---- ✋ HMD hand-teleop launch (proxied through this cockpit; :8001 is cross-origin) ----
const handBtn=$("handLaunchBtn");
const handMsg=$("handMsg");
handBtn.onclick=async()=>{
  handBtn.disabled=true;
  handMsg.className="desc"; handMsg.textContent="HMD 起動中…（adb/CDP、最大 20 秒）";
  try{
    const r=await(await post("/quest/launch-hand",{})).json();
    handMsg.textContent=r.message||(r.ok?"起動しました。":"起動に失敗しました。");
    handMsg.className="desc"+(r.ok?" good":" bad");
  }catch(e){
    handMsg.textContent="起動リクエストに失敗しました: "+e;
    handMsg.className="desc bad";
  }finally{
    handBtn.disabled=false;
  }
};

async function pollHand(){
  const sb=$("handSrvBadge");
  const mb=$("handMcuBadge");
  try{
    const s=await(await fetch("/hand-status")).json();
    if(!s.server_up){
      sb.textContent="ハンド:サーバ停止"; sb.className="badge gray";
      mb.textContent="MCU:--"; mb.className="badge gray";
    }else{
      sb.textContent="ハンド:起動中"; sb.className="badge ok";
      if(s.mcu_alive){mb.textContent="MCU:応答"; mb.className="badge ok";}
      else if(s.connected){mb.textContent="MCU:応答なし"; mb.className="badge warn";}
      else{mb.textContent="MCU:未接続"; mb.className="badge warn";}
    }
  }catch(e){
    // cockpit server itself unreachable — connBadge already reflects that.
    sb.textContent="ハンド:確認不可"; sb.className="badge gray";
    mb.textContent="MCU:--"; mb.className="badge gray";
  }
  setTimeout(pollHand,10000);
}
pollHand();
